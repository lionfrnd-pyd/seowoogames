<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dce7dc">
  <title>낱말퀴즈 | 서우의 게임</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Trebuchet MS", "Noto Sans KR", sans-serif;
      color: #23332f;
      background: #dce7dc;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100svh;
      margin: 0;
      background: linear-gradient(180deg, #dce7dc 0%, #edf0e3 48%, #f6f0df 100%);
      overflow-x: hidden;
    }

    .landscape {
      position: fixed;
        z-index: 0;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .mountain {
      position: absolute;
      bottom: 20%;
      width: 75vw;
      height: 42vh;
      min-height: 220px;
      opacity: .48;
      clip-path: polygon(0 100%, 36% 25%, 45% 39%, 64% 0, 100% 100%);
    }

    .mountain-one {
      left: -18vw;
      background: linear-gradient(145deg, #8eaaa4, #d6dacc 68%);
    }

    .mountain-two {
      right: -25vw;
      bottom: 24%;
      width: 85vw;
      height: 48vh;
      opacity: .55;
      background: linear-gradient(135deg, #6e8f91, #c0d0c0 65%);
      transform: scaleX(-1);
    }

    .ridge {
      position: absolute;
      right: -8vw;
      bottom: 14%;
      left: -8vw;
      height: 22vh;
      min-height: 120px;
      background: linear-gradient(165deg, #829e88 0 45%, #cbd6bd 46% 100%);
      clip-path: polygon(0 67%, 22% 35%, 46% 65%, 71% 21%, 100% 60%, 100% 100%, 0 100%);
      opacity: .36;
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(100%, 720px);
      margin: 0 auto;
      padding: max(14px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
      margin-bottom: 12px;
    }

    .home-link,
    .restart-button {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 12px;
      border: 1px solid #9aab9e;
      border-radius: 10px;
      background: #f7f5e9d9;
      color: #334940;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      touch-action: manipulation;
    }

    .top-mark {
      color: #65796c;
      font-size: 11px;
      font-weight: 850;
    }

    .intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 2px 14px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #627568;
      font-size: 12px;
      font-weight: 850;
    }

    h1 {
      margin: 0;
      color: #243b36;
      font-family: Georgia, "Noto Serif KR", serif;
      font-size: 34px;
      line-height: 1.1;
    }

    .score {
      flex: 0 0 auto;
      padding: 8px 11px;
      border: 1px solid #aeb9a3;
      border-radius: 9px;
      background: #fffbea;
      color: #38564a;
      font-size: 12px;
      font-weight: 850;
    }

    .progress-track {
      height: 5px;
      overflow: hidden;
      border-radius: 8px;
      background: #c4cfbf;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: #dc8155;
      transition: width 180ms ease-out;
    }

    .board {
      position: relative;
      margin-top: 15px;
      padding: 13px;
      border: 1px solid #bbc1ae;
      border-radius: 8px;
      background-color: #f1edda;
      background-image:
        linear-gradient(90deg, #596c5c0b 1px, transparent 1px),
        linear-gradient(#596c5c0b 1px, transparent 1px),
        radial-gradient(ellipse at 18% 0%, #fff8df 0, transparent 70%);
      background-size: 26px 26px, 26px 26px, auto;
      box-shadow: 0 5px 15px #57655324, inset 0 0 20px #a0a58a22;
    }

    .board-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .board-head h2,
    .bank-head h2 {
      margin: 0;
      color: #344a40;
      font-size: 15px;
      font-weight: 900;
    }

    .board-help {
      margin: 0;
      color: #68786b;
      font-size: 11px;
    }

    .word-list {
      display: grid;
      gap: 7px;
    }

    .word-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      min-height: 54px;
      padding: 6px 7px;
      border: 1px solid #c8c8b7;
      border-radius: 7px;
      background: #fffdf3d9;
      transition: border-color 150ms ease, background 150ms ease;
    }

    .word-row.active {
      border-color: #497c68;
      background: #e4efdf;
      box-shadow: inset 0 0 0 1px #497c68;
    }

    .word-row.solved { background: #e2edda; }

    .clue-button {
      display: grid;
      grid-template-columns: 26px minmax(0, 1fr);
      align-items: center;
      gap: 7px;
      min-width: 0;
      min-height: 40px;
      padding: 2px;
      border: 0;
      background: transparent;
      color: #34433b;
      text-align: left;
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }

    .clue-number {
      display: grid;
      width: 24px;
      aspect-ratio: 1;
      place-items: center;
      border-radius: 5px;
      background: #dbe0ce;
      color: #465e51;
      font-size: 11px;
      font-weight: 900;
    }

    .clue-text {
      font-size: 12px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .word-row.solved .clue-text { color: #55705c; }

    .answer-slots {
      display: flex;
      flex: 0 0 auto;
      gap: 3px;
    }

    .letter-cell {
      display: grid;
      width: 34px;
      aspect-ratio: 1;
      place-items: center;
      padding: 0;
      border: 1px solid #b8b8a7;
      border-radius: 4px;
      background: #f2e7b6;
      color: #24332d;
      font-family: "Noto Serif KR", Georgia, serif;
      font-size: 19px;
      font-weight: 900;
      cursor: pointer;
      touch-action: manipulation;
    }

    .letter-cell.empty { background: #ffffff9e; }
    .letter-cell:disabled { cursor: default; }

    .bank-section {
      margin-top: 16px;
      padding: 0 2px;
    }

    .bank-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 9px;
    }

    .bank-head span {
      color: #627568;
      font-size: 11px;
    }

    .letter-bank {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 7px;
    }

    .bank-tile {
      display: grid;
      min-width: 0;
      min-height: 48px;
      aspect-ratio: 1.15;
      place-items: center;
      border: 1px solid #d5c285;
      border-radius: 5px;
      background: linear-gradient(145deg, #fff4c9, #e8d696);
      box-shadow: 0 2px 0 #cbb879;
      color: #26342e;
      font-family: "Noto Serif KR", Georgia, serif;
      font-size: 20px;
      font-weight: 950;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 100ms ease, opacity 100ms ease;
    }

    .bank-tile:not(:disabled):active { transform: translateY(2px); }
    .bank-tile:disabled { opacity: .38; box-shadow: none; cursor: default; }

    .game-actions {
      display: flex;
      gap: 9px;
      margin-top: 13px;
    }

    .action-button {
      display: inline-flex;
      min-height: 46px;
      flex: 1;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      border: 1px solid #879887;
      border-radius: 8px;
      background: #f6f3e5;
      color: #344940;
      font: inherit;
      font-size: 13px;
      font-weight: 850;
      cursor: pointer;
      touch-action: manipulation;
    }

    .action-button.primary {
      border-color: #526e5d;
      background: #526e5d;
      color: #fffdf3;
    }

    .action-button:disabled { opacity: .45; cursor: not-allowed; }

    .game-status {
      min-height: 24px;
      margin: 10px 2px 0;
      color: #3c594c;
      font-size: 12px;
      font-weight: 750;
      line-height: 1.5;
      text-align: center;
    }

    .finish {
      position: fixed;
      z-index: 5;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #17241fc9;
      backdrop-filter: blur(4px);
    }

    .finish[hidden] { display: none; }

    .finish-dialog {
      width: min(100%, 360px);
      padding: 25px 22px;
      border: 1px solid #c7b878;
      border-radius: 12px;
      background: #fff9e7;
      color: #293d33;
      text-align: center;
      box-shadow: 0 18px 55px #101a16a6;
    }

    .finish-dialog .medal { font-size: 43px; }
    .finish-dialog h2 { margin: 8px 0; font-size: 23px; }
    .finish-dialog p { margin: 0 0 18px; color: #59695b; font-size: 14px; line-height: 1.6; }
    .finish-dialog .action-button { width: 100%; }

    button:focus-visible,
    a:focus-visible { outline: 3px solid #dc8155; outline-offset: 3px; }

    @media (min-width: 620px) {
      .app { padding-top: 22px; }
      .intro { padding: 12px 2px 18px; }
      h1 { font-size: 40px; }
      .board { padding: 18px; }
      .word-list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
      .word-row { grid-template-columns: minmax(0, 1fr); align-content: center; padding: 10px; }
      .answer-slots { padding-left: 32px; }
      .letter-cell { width: 38px; }
      .bank-section { margin-top: 20px; }
      .letter-bank { grid-template-columns: repeat(8, minmax(0, 1fr)); }
    }

    @media (max-width: 370px) {
      .app { padding-right: 11px; padding-left: 11px; }
      .board { padding: 9px; }
      .word-row { gap: 5px; padding: 5px; }
      .clue-button { grid-template-columns: 22px minmax(0, 1fr); gap: 4px; }
      .clue-number { width: 21px; }
      .clue-text { font-size: 11px; }
      .letter-cell { width: 30px; font-size: 17px; }
      .letter-bank { gap: 5px; }
      .bank-tile { min-height: 43px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="landscape" aria-hidden="true">
    <div class="mountain mountain-one"></div>
    <div class="mountain mountain-two"></div>
    <div class="ridge"></div>
  </div>
  <div class="app">
    <header class="topbar">
      <a class="home-link" href="index.html" aria-label="홈으로 돌아가기">← 홈</a>
      <span class="top-mark">SEO WOO GAME</span>
      <button class="restart-button" id="restartButton" type="button" title="현재 퍼즐 다시 시작">↻ 다시</button>
    </header>
    <main>
      <section class="intro" aria-labelledby="pageTitle">
        <div><p class="eyebrow">글자를 모아 낱말을 완성해 봐</p><h1 id="pageTitle">낱말퀴즈</h1></div>
        <div class="score" id="roundLabel">퍼즐 1 / 3</div>
      </section>
      <div class="progress-track" role="progressbar" aria-label="퍼즐 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progressFill"></div></div>
      <section class="board" aria-labelledby="boardTitle">
        <div class="board-head"><h2 id="boardTitle">낱말 칸</h2><p class="board-help">힌트를 누르고 글자 타일을 골라요</p></div>
        <div class="word-list" id="wordList"></div>
      </section>
      <section class="bank-section" aria-labelledby="bankTitle">
        <div class="bank-head"><h2 id="bankTitle">글자 타일</h2><span id="tileCount">0개 남음</span></div>
        <div class="letter-bank" id="letterBank" aria-label="선택할 글자 타일"></div>
        <div class="game-actions">
          <button class="action-button" id="clearWordButton" type="button">현재 낱말 지우기</button>
          <button class="action-button primary" id="nextPuzzleButton" type="button" hidden>다음 퍼즐</button>
        </div>
        <p class="game-status" id="gameStatus" role="status" aria-live="polite"></p>
      </section>
    </main>
  </div>
  <div class="finish" id="finishDialog" hidden>
    <section class="finish-dialog" role="dialog" aria-modal="true" aria-labelledby="finishTitle">
      <div class="medal" aria-hidden="true">🏆</div>
      <h2 id="finishTitle">퍼즐 완성!</h2>
      <p id="finishMessage">모든 낱말을 맞혔어요.</p>
      <button class="action-button primary" id="finishButton" type="button">다음 퍼즐</button>
    </section>
  </div>
  <script>
    const puzzles = [
      {
        theme: '바다와 하늘',
        words: [
          { clue: '바다에 사는 아주 큰 동물', answer: '고래' },
          { clue: '노랗고 길쭉한 과일', answer: '바나나' },
          { clue: '비 오는 날 펼쳐 쓰는 물건', answer: '우산' },
          { clue: '밤하늘에서 반짝이는 것', answer: '별' },
          { clue: '하루가 시작되는 시간', answer: '아침' }
        ]
      },
      {
        theme: '동물과 생활',
        words: [
          { clue: '멍멍 짖는 귀여운 동물', answer: '강아지' },
          { clue: '줄무늬가 있는 큰 고양잇과 동물', answer: '호랑이' },
          { clue: '빨갛거나 초록색인 동그란 과일', answer: '사과' },
          { clue: '친구들과 함께 공부하는 곳', answer: '학교' },
          { clue: '철길 위를 달리는 긴 탈것', answer: '기차' }
        ]
      },
      {
        theme: '자연과 놀이',
        words: [
          { clue: '비가 그친 뒤 하늘에 여러 색으로 뜨는 것', answer: '무지개' },
          { clue: '긴 귀와 동그란 꼬리가 귀여운 동물', answer: '토끼' },
          { clue: '글씨를 쓰거나 그림을 그릴 때 쓰는 것', answer: '연필' },
          { clue: '작고 빨간 봄철 과일', answer: '딸기' },
          { clue: '하늘에 떠서 모양이 바뀌는 것', answer: '구름' }
        ]
      }
    ];

    const wordList = document.getElementById('wordList');
    const letterBank = document.getElementById('letterBank');
    const roundLabel = document.getElementById('roundLabel');
    const tileCount = document.getElementById('tileCount');
    const gameStatus = document.getElementById('gameStatus');
    const progressTrack = document.querySelector('.progress-track');
    const progressFill = document.getElementById('progressFill');
    const clearWordButton = document.getElementById('clearWordButton');
    const nextPuzzleButton = document.getElementById('nextPuzzleButton');
    const finishDialog = document.getElementById('finishDialog');
    const finishMessage = document.getElementById('finishMessage');
    const finishButton = document.getElementById('finishButton');

    let puzzleIndex = 0;
    let selectedWord = 0;
    let tiles = [];
    let placed = [];
    let solved = new Set();

    function shuffle(items) {
      const result = [...items];
      for (let index = result.length - 1; index > 0; index--) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [result[index], result[swapIndex]] = [result[swapIndex], result[index]];
      }
      return result;
    }

    function startPuzzle() {
      const puzzle = puzzles[puzzleIndex];
      tiles = shuffle(puzzle.words.flatMap(word => [...word.answer])).map((letter, id) => ({ id, letter }));
      placed = puzzle.words.map(word => Array(word.answer.length).fill(null));
      solved = new Set();
      selectedWord = 0;
      roundLabel.textContent = `퍼즐 ${puzzleIndex + 1} / ${puzzles.length} · ${puzzle.theme}`;
      gameStatus.textContent = '1번 힌트를 누르고 글자 타일을 차례대로 골라요.';
      nextPuzzleButton.hidden = true;
      finishDialog.hidden = true;
      render();
    }

    function render() {
      const puzzle = puzzles[puzzleIndex];
      const solvedCount = solved.size;
      const progress = Math.round(solvedCount / puzzle.words.length * 100);
      progressFill.style.width = `${progress}%`;
      progressTrack.setAttribute('aria-valuenow', String(progress));
      tileCount.textContent = `${tiles.filter(tile => !isTileUsed(tile.id)).length}개 남음`;
      clearWordButton.disabled = solved.has(selectedWord) || placed[selectedWord].every(id => id === null);
      nextPuzzleButton.hidden = solvedCount !== puzzle.words.length;

      wordList.innerHTML = puzzle.words.map((word, wordIndex) => {
        const isSolved = solved.has(wordIndex);
        const isActive = selectedWord === wordIndex && !isSolved;
        const cells = [...word.answer].map((_, position) => {
          const tileId = placed[wordIndex][position];
          const letter = tileId === null ? '' : tiles.find(tile => tile.id === tileId).letter;
          return `<button class="letter-cell ${letter ? '' : 'empty'}" type="button" data-cell-word="${wordIndex}" data-cell-position="${position}" aria-label="${letter ? `${letter} 글자 지우기` : `${wordIndex + 1}번 낱말 빈 칸`}" ${isSolved ? 'disabled' : ''}>${letter || '　'}</button>`;
        }).join('');
        return `<div class="word-row ${isActive ? 'active' : ''} ${isSolved ? 'solved' : ''}">
          <button class="clue-button" type="button" data-select-word="${wordIndex}" aria-pressed="${isActive}" ${isSolved ? 'disabled' : ''}>
            <span class="clue-number">${isSolved ? '✓' : wordIndex + 1}</span><span class="clue-text">${word.clue}</span>
          </button>
          <div class="answer-slots" aria-label="${word.answer.length}글자 낱말">${cells}</div>
        </div>`;
      }).join('');

      letterBank.innerHTML = tiles.map(tile => {
        const disabled = isTileUsed(tile.id) || solvedCount === puzzle.words.length;
        return `<button class="bank-tile" type="button" data-tile-id="${tile.id}" aria-label="${tile.letter} 글자 타일" ${disabled ? 'disabled' : ''}>${tile.letter}</button>`;
      }).join('');
    }

    function isTileUsed(tileId) {
      return placed.some(word => word.includes(tileId));
    }

    function chooseNextWord() {
      const next = puzzles[puzzleIndex].words.findIndex((_, index) => !solved.has(index));
      if (next !== -1) selectedWord = next;
    }

    function placeTile(tileId) {
      if (solved.has(selectedWord) || isTileUsed(tileId)) return;
      const emptyPosition = placed[selectedWord].indexOf(null);
      if (emptyPosition === -1) {
        gameStatus.textContent = '현재 낱말 칸이 다 찼어요. 칸을 눌러 고치거나 지워 주세요.';
        return;
      }
      placed[selectedWord][emptyPosition] = tileId;
      const word = puzzles[puzzleIndex].words[selectedWord];
      const isComplete = placed[selectedWord].every(id => id !== null);
      if (isComplete) {
        const answer = placed[selectedWord].map(id => tiles.find(tile => tile.id === id).letter).join('');
        if (answer === word.answer) {
          solved.add(selectedWord);
          const completedCount = solved.size;
          gameStatus.textContent = `정답이에요! ${completedCount} / ${puzzles[puzzleIndex].words.length}개 완성`;
          if (completedCount === puzzles[puzzleIndex].words.length) showFinish();
          else chooseNextWord();
        } else {
          gameStatus.textContent = '순서가 맞지 않아요. 칸을 눌러 고치거나 현재 낱말을 지워 보세요.';
        }
      }
      render();
    }

    function removeLetter(wordIndex, position) {
      if (solved.has(wordIndex)) return;
      const tileId = placed[wordIndex][position];
      if (tileId === null) return;
      placed[wordIndex][position] = null;
      selectedWord = wordIndex;
      gameStatus.textContent = '글자 타일이 다시 돌아왔어요.';
      render();
    }

    function clearSelectedWord() {
      if (solved.has(selectedWord)) return;
      placed[selectedWord].fill(null);
      gameStatus.textContent = `${selectedWord + 1}번 낱말을 다시 풀어 보세요.`;
      render();
    }

    function showFinish() {
      const isLastPuzzle = puzzleIndex === puzzles.length - 1;
      finishMessage.textContent = isLastPuzzle
        ? '세 가지 퍼즐을 모두 풀었어요. 정말 잘했어요!'
        : `${puzzles[puzzleIndex].theme} 퍼즐을 완성했어요! 다음 낱말도 풀어 볼까요?`;
      finishButton.textContent = isLastPuzzle ? '처음부터 다시' : '다음 퍼즐';
      finishDialog.hidden = false;
      finishButton.focus();
    }

    function advancePuzzle() {
      if (puzzleIndex === puzzles.length - 1) puzzleIndex = 0;
      else puzzleIndex++;
      startPuzzle();
    }

    wordList.addEventListener('click', event => {
      const clue = event.target.closest('[data-select-word]');
      if (clue) {
        selectedWord = Number(clue.dataset.selectWord);
        gameStatus.textContent = `${selectedWord + 1}번 힌트를 골랐어요. 글자 타일을 채워 보세요.`;
        render();
        return;
      }
      const cell = event.target.closest('[data-cell-word]');
      if (cell) removeLetter(Number(cell.dataset.cellWord), Number(cell.dataset.cellPosition));
    });

    letterBank.addEventListener('click', event => {
      const tile = event.target.closest('[data-tile-id]');
      if (tile) placeTile(Number(tile.dataset.tileId));
    });

    clearWordButton.addEventListener('click', clearSelectedWord);
    nextPuzzleButton.addEventListener('click', advancePuzzle);
    finishButton.addEventListener('click', advancePuzzle);
    document.getElementById('restartButton').addEventListener('click', startPuzzle);
    startPuzzle();
  </script>
</body>
</html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><meta name="theme-color" content="#121d39"><title>한자 탐험대 - 터치 모험</title><style>
:root{font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#f7faff;background:#101930}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 15% 5%,#314e88,transparent 38%),radial-gradient(circle at 80% 85%,#253861,transparent 35%),#101930}button{font:inherit;cursor:pointer;touch-action:manipulation;border:0}button:focus-visible{outline:3px solid #fff18b;outline-offset:2px}#app{max-width:670px;margin:auto;padding:12px 14px 44px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}.logo{font-weight:1000;font-size:21px}.top button,.smallbtn{background:#31476e;color:white;border:1px solid #6683ad;border-radius:11px;padding:9px 11px}.panel{background:#1c2b4c;border:1px solid #516a98;border-radius:23px;padding:19px;box-shadow:0 12px 25px #07112650}.center{text-align:center}h1{font-size:clamp(29px,6vw,40px);line-height:1.3;margin:12px 0}h2{font-size:25px;margin:10px 0 12px}h3{font-size:19px;margin:10px 0}p{color:#d1dcf2;line-height:1.6}small,.sub{color:#bbcdea}.eyebrow{display:inline-block;background:#384f7e;color:#ffe8a2;font-weight:850;border-radius:22px;padding:7px 12px;font-size:13px}.btn{background:linear-gradient(180deg,#ffe284,#ffb947);color:#34261b;padding:15px 20px;border-radius:16px;font-weight:950;min-height:51px}.btn.secondary{background:#344d79;color:white;border:1px solid #718cbd}.btn.green{background:#76e1b3;color:#123d31}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:20px 0 2px}.actions .btn{flex:1;min-width:135px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.stat{padding:13px 6px;text-align:center;background:#27395e;border-radius:14px}.stat strong{display:block;font-size:23px;color:#ffdf83}.stat span{font-size:12px;color:#d4dded}.worlds{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.world{position:relative;background:#263e65;border:1px solid #5f7aa6;border-radius:17px;color:white;padding:16px 10px;text-align:left;min-height:145px}.world:disabled{opacity:.5}.world .em{font-size:36px;display:block}.world b{display:block;margin:8px 0 4px}.world small{display:block;font-size:12px}.world .tag{position:absolute;top:11px;right:9px;color:#ffe27d}.progress{height:10px;background:#354363;border-radius:10px;overflow:hidden;margin:13px 0}.progress>div{height:100%;background:#ffcf66;transition:width .2s}.flash{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:15px 0}.hanja{font-family:'Noto Serif CJK KR','Nanum Myeongjo',serif;font-size:clamp(96px,23vw,165px);line-height:1.3;display:block;text-align:center;color:white;text-shadow:0 7px 20px #0005}.wordinfo{font-size:25px;font-weight:900;text-align:center;color:#ffe594}.tip{font-size:14px;color:#cbd7f1;text-align:center}.modegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.mode{background:#2e4775;border:1px solid #7195c5;color:#fff;border-radius:15px;padding:16px 8px;font-weight:850;min-height:100px}.mode span{display:block;font-size:34px;margin-bottom:6px}.pairs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:17px 0}.tile{min-height:90px;background:#304a79;color:#fff;border:2px solid #668ab9;border-radius:17px;padding:9px;font-size:20px;font-weight:800;overflow-wrap:anywhere;transition:transform .12s,background .12s}.tile.glyph{font-size:49px;font-family:'Noto Serif CJK KR',serif}.tile.selected{background:#775caf;border-color:#e3b7ff;transform:scale(1.02)}.tile.matched{background:#205947;border-color:#6ce5b4;opacity:.56}.tile.bad{background:#813d59;border-color:#ffa9b8}.meter{display:flex;justify-content:space-between;color:#fae5ac;font-weight:800;gap:8px}.drawbox{position:relative;max-width:350px;aspect-ratio:1;margin:15px auto;background:#fff9e9;border:5px solid #b6bfe2;border-radius:19px;overflow:hidden;touch-action:none}.guide{position:absolute;inset:0;display:grid;place-items:center;color:#e1d9c9;font-family:'Noto Serif CJK KR','Malgun Gothic',serif;font-size:clamp(170px,55vw,260px);line-height:1;pointer-events:none;user-select:none}.drawbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.controls button{min-width:116px}.boss{font-size:85px;text-align:center;margin:12px}.enemyhp{font-weight:900;color:#ffacbe;text-align:center}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.choice{min-height:82px;border:2px solid #7e9fd0;border-radius:17px;background:#314b7a;color:white;font-size:21px;font-weight:850}.choice:active,.tile:active,.world:active{transform:scale(.97)}.feedback{text-align:center;font-weight:850;min-height:32px;margin:11px 0;color:#ffe29a}.footer{font-size:12px;color:#9db1d4;text-align:center;margin:20px 0}.hidden{display:none!important}.reward{font-size:69px}.miniword{display:inline-block;background:#34496e;border-radius:9px;padding:7px 10px;margin:4px}.danger{background:#893d53;color:#fff}.notice{background:#253b61;border-radius:15px;padding:12px;margin:13px 0;color:#dde7f5;line-height:1.6} @media(max-width:380px){.panel{padding:14px}.worlds{gap:7px}.tile{min-height:77px}.logo{font-size:18px}.top button{padding:8px}}
</style><link rel="stylesheet" href="feedback.css"></head><body><main id="app"></main>
<section class="feedback-panel" data-feedback-panel aria-labelledby="feedbackTitle">
	<div class="feedback-heading">
		<div><h2 id="feedbackTitle">서우의 요청 기록</h2><p>필요한 점을 적어 두면 이 브라우저에서 두 게임의 기록을 함께 볼 수 있어요.</p></div>
		<span class="feedback-count" id="feedbackCount" aria-label="저장된 요청 수">0</span>
	</div>
	<form class="feedback-form" id="feedbackForm">
		<label class="feedback-label">게임
			<select class="feedback-control" name="game">
				<option value="jump">점프</option><option value="hanja" selected>한자</option><option value="both">공통</option>
			</select>
		</label>
		<label class="feedback-label">필요한 기능이나 바꾸고 싶은 점
			<textarea class="feedback-control feedback-message" name="message" rows="3" maxlength="500" required placeholder="생각난 내용을 여기에 적어줘"></textarea>
		</label>
		<div class="feedback-form-footer"><span class="feedback-status" id="feedbackStatus" role="status" aria-live="polite">이 기록은 이 브라우저에만 저장돼요.</span><button class="feedback-submit" type="submit">기록하기</button></div>
	</form>
	<div class="feedback-history-heading"><h3>요청 히스토리</h3><button class="feedback-clear" id="feedbackClear" type="button">전체 삭제</button></div>
	<ol class="feedback-list" id="feedbackList" aria-live="polite"></ol>
</section>
<script>
'use strict';
const DATA=[
 {name:'자연의 숲',emoji:'🌿',boss:'🌳 숲의 수호자',words:[['日','날','일'],['月','달','월'],['山','메','산'],['水','물','수'],['火','불','화'],['木','나무','목'],['土','흙','토'],['石','돌','석'],['雨','비','우'],['天','하늘','천']]},
 {name:'사람 마을',emoji:'🧑',boss:'🦁 마을의 사자',words:[['人','사람','인'],['口','입','구'],['目','눈','목'],['耳','귀','이'],['手','손','수'],['足','발','족'],['心','마음','심'],['身','몸','신'],['子','아들','자'],['男','사내','남']]},
 {name:'숫자 사막',emoji:'🏜️',boss:'🐍 숫자의 뱀',words:[['一','한','일'],['二','두','이'],['三','석','삼'],['四','넉','사'],['五','다섯','오'],['六','여섯','육'],['七','일곱','칠'],['八','여덟','팔'],['九','아홉','구'],['十','열','십']]},
 {name:'방향의 성',emoji:'🏰',boss:'🐉 방향의 용',words:[['上','위','상'],['下','아래','하'],['中','가운데','중'],['左','왼','좌'],['右','오른','우'],['前','앞','전'],['後','뒤','후'],['東','동녘','동'],['西','서녘','서'],['南','남녘','남']]},
 {name:'지식 도서관',emoji:'📚',boss:'🦉 지혜의 부엉이',words:[['學','배울','학'],['校','학교','교'],['文','글월','문'],['字','글자','자'],['書','글','서'],['讀','읽을','독'],['問','물을','문'],['答','대답','답'],['先','먼저','선'],['名','이름','명']]},
 {name:'생활의 항구',emoji:'⛵',boss:'🐙 바다 문어',words:[['父','아버지','부'],['母','어머니','모'],['兄','형','형'],['弟','아우','제'],['家','집','가'],['室','집','실'],['門','문','문'],['食','먹을','식'],['衣','옷','의'],['住','살','주']]},
 {name:'시간의 탑',emoji:'⏰',boss:'🧙 시간 마법사',words:[['年','해','년'],['時','때','시'],['分','나눌','분'],['午','낮','오'],['朝','아침','조'],['夕','저녁','석'],['今','이제','금'],['古','옛','고'],['早','이를','조'],['春','봄','춘']]},
 {name:'최후의 화산',emoji:'🌋',boss:'👑 한자 대마왕',words:[['大','큰','대'],['小','작을','소'],['多','많을','다'],['少','적을','소'],['長','길','장'],['短','짧을','단'],['高','높을','고'],['低','낮을','저'],['新','새','신'],['正','바를','정']]}
];
const KEY='hanja-touch-adventure-v2';
const init=()=>({opened:0,cleared:[],gems:0,traced:{},sound:true});let save=init();try{const raw=JSON.parse(localStorage.getItem(KEY));if(raw)save={...init(),...raw};}catch(e){}
const app=document.getElementById('app');let wi=0,card=0,match=null,drawCleanup=null,boss=null,drawCount=0,drawDone=false,toastTimer=0;
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}};
const pick=a=>a[Math.floor(Math.random()*a.length)];const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function sound(ok=true){if(!save.sound)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?730:270;g.gain.value=.055;o.start();o.stop(c.currentTime+.12);o.onended=()=>c.close();}catch(e){}}
function say(t){clearTimeout(toastTimer);document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.style='position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#101f3b;border:2px solid #ffdc85;padding:13px;border-radius:15px;z-index:10;text-align:center;min-width:180px;max-width:90%';e.textContent=t;document.body.appendChild(e);toastTimer=setTimeout(()=>e.remove(),2000)}
function clearDraw(){if(drawCleanup){drawCleanup();drawCleanup=null}}
function layout(body){clearDraw();app.innerHTML=`<header class="top"><div class="logo">🀄 한자 탐험대</div><div><button id="mute">${save.sound?'🔊':'🔇'}</button> <button id="home">🏠</button></div></header>${body}<div class="footer">인터넷 없이 실행 · 기록은 현재 브라우저에 자동 저장</div>`;document.getElementById('home').onclick=home;document.getElementById('mute').onclick=()=>{save.sound=!save.sound;persist();document.getElementById('mute').textContent=save.sound?'🔊':'🔇'}}
function home(){match=null;boss=null;layout(`<section class="center"><span class="eyebrow">✋ 손으로 놀면서 한자 배우기!</span><h1>한자 탐험대<br>터치 대모험 🏝️</h1><p>카드를 넘기고, 짝을 찾고, 손가락으로 써 보자!<br>마지막에는 몬스터와 보스 대결!</p></section><div class="stats"><div class="stat"><strong>${save.cleared.length}/8</strong><span>완료 월드</span></div><div class="stat"><strong>💎 ${save.gems}</strong><span>보석</span></div><div class="stat"><strong>${Object.values(save.traced).filter(Boolean).length}</strong><span>따라 쓴 한자</span></div></div><h3>🗺️ 모험 지도</h3><div class="worlds">${DATA.map((w,i)=>`<button class="world" data-w="${i}" ${i>save.opened?'disabled':''}><span class="em">${i>save.opened?'🔒':w.emoji}</span><b>${i+1}. ${w.name}</b><small>${i>save.opened?'이전 보스부터 쓰러뜨리자':save.cleared.includes(i)?'🏆 클리어 · 다시 놀기':'한자 10개 · 터치 미션'}</small>${save.cleared.includes(i)?'<span class="tag">⭐</span>':''}</button>`).join('')}</div><div class="actions"><button class="btn secondary" id="reset">🧹 완전 초기화</button></div>`);document.querySelectorAll('[data-w]').forEach(e=>e.onclick=()=>world(+e.dataset.w));document.getElementById('reset').onclick=()=>{if(confirm('모든 보석과 월드 기록을 삭제할까요?')){save=init();persist();home()}}}
function world(i){wi=i;match=null;boss=null;const w=DATA[i];layout(`<section class="panel center"><span class="eyebrow">월드 ${i+1} / 8</span><div style="font-size:75px;margin:10px">${w.emoji}</div><h1>${w.name}</h1><p>이곳에 숨은 한자 10개를 익혀서<br>${w.boss}를 물리치자!</p><div class="modegrid"><button class="mode" id="learn"><span>🃏</span>카드 넘기기<small>보고 익히기</small></button><button class="mode" id="matching"><span>🧩</span>짝 맞추기<small>터치 기억력 게임</small></button><button class="mode" id="writing"><span>✍️</span>손가락 쓰기<small>따라 쓰기 연습</small></button><button class="mode" id="battle"><span>⚔️</span>보스 대결<small>몬스터 공격</small></button></div><div class="notice">💡 추천 순서: <b>카드 → 짝 찾기 → 손가락 쓰기 → 보스</b><br>중간에 틀려도 하트가 없어지지 않아요!</div><div class="actions"><button class="btn secondary" id="map">← 지도</button></div></section>`);document.getElementById('learn').onclick=()=>flash(0);document.getElementById('matching').onclick=startMatch;document.getElementById('writing').onclick=()=>write(0);document.getElementById('battle').onclick=startBattle;document.getElementById('map').onclick=home}
function flash(i){card=(i+10)%10;const w=DATA[wi],a=w.words[card];layout(`<section class="panel center"><span class="eyebrow">🃏 탐험 카드 ${card+1} / 10</span><div class="progress"><div style="width:${(card+1)*10}%"></div></div><span class="hanja">${a[0]}</span><div class="wordinfo">${a[1]} ${a[2]}</div><p class="tip">한자를 큰 소리로 읽고, 좌우 버튼으로 넘겨봐!</p><div class="actions"><button class="btn secondary" id="prev">⬅ 이전</button><button class="btn" id="next">다음 ➡</button></div><div class="actions"><button class="btn secondary" id="back">월드 메뉴</button><button class="btn green" id="match">🧩 짝 맞추기</button></div></section>`);document.getElementById('prev').onclick=()=>flash(card-1);document.getElementById('next').onclick=()=>flash(card+1);document.getElementById('back').onclick=()=>world(wi);document.getElementById('match').onclick=startMatch;let x=null;const el=document.querySelector('.hanja');el.addEventListener('touchstart',e=>{x=e.touches[0].clientX},{passive:true});el.addEventListener('touchend',e=>{if(x===null)return;const d=e.changedTouches[0].clientX-x;if(Math.abs(d)>45)flash(card+(d<0?1:-1));x=null},{passive:true})}
function startMatch(){const words=shuffle(DATA[wi].words).slice(0,4);match={words,items:shuffle(words.flatMap((w,i)=>[{id:i,type:'glyph',text:w[0]},{id:i,type:'meaning',text:w[1]+' '+w[2]}])),picked:null,done:[],wrong:false};showMatch()}
function showMatch(){const m=match;if(!m)return;layout(`<section class="panel center"><span class="eyebrow">🧩 터치 짝 찾기</span><h2>한자와 뜻을 연결해!</h2><p>한자 하나와 같은 뜻의 카드를 차례대로 눌러 봐.</p><div class="meter"><span>🎯 ${m.done.length}/4 짝 성공</span><span>💎 ${save.gems}</span></div><div class="pairs">${m.items.map((x,i)=>`<button class="tile ${x.type==='glyph'?'glyph':''} ${m.done.includes(x.id)?'matched':''} ${m.picked===i?'selected':''}" data-pair="${i}" ${m.done.includes(x.id)?'disabled':''}>${x.text}</button>`).join('')}</div><div class="feedback" id="fb">${m.done.length===4?'🎉 모두 맞혔어! 보석 +20':'카드 두 개를 터치해 봐!'}</div><div class="actions"><button class="btn secondary" id="menu">월드 메뉴</button><button class="btn" id="again">🔄 새 짝 찾기</button>${m.done.length===4?'<button class="btn green" id="write">✍️ 한자 쓰기</button>':''}</div></section>`);document.querySelectorAll('[data-pair]').forEach(e=>e.onclick=()=>tapPair(+e.dataset.pair));document.getElementById('again').onclick=startMatch;document.getElementById('menu').onclick=()=>world(wi);if(document.getElementById('write'))document.getElementById('write').onclick=()=>write(0)}
function tapPair(i){const m=match;if(!m||m.busy)return;const x=m.items[i];if(m.done.includes(x.id))return;if(m.picked===null){m.picked=i;showMatch();return}const prev=m.items[m.picked];if(m.picked===i){m.picked=null;showMatch();return}if(prev.id===x.id&&prev.type!==x.type){m.done.push(x.id);m.picked=null;save.gems+=5;if(m.done.length===4)save.gems+=20;persist();sound();showMatch()}else{m.busy=true;const tiles=document.querySelectorAll('[data-pair]');tiles[i]?.classList.add('bad');tiles[m.picked]?.classList.add('bad');document.getElementById('fb').textContent='다른 짝이야! 다시 찾아보자 😊';sound(false);setTimeout(()=>{if(match!==m)return;m.picked=null;m.busy=false;showMatch()},650)}}
function write(i){card=(i+10)%10;drawCount=0;drawDone=false;const w=DATA[wi].words[card];layout(`<section class="panel center"><span class="eyebrow">✍️ 손가락 한자 쓰기 ${card+1} / 10</span><h2>${w[1]} ${w[2]}</h2><p class="tip">회색 글자 위를 손가락으로 따라 그려 보자.<br>세 번 이상 손을 움직여 연습하면 보석을 받을 수 있어!</p><div class="drawbox" id="draw"><div class="guide">${w[0]}</div><canvas id="canvas" aria-label="손가락으로 한자를 따라 그리는 영역"></canvas></div><p class="feedback" id="drawfb">손가락이나 마우스로 따라 그려 봐!</p><div class="controls"><button class="btn secondary" id="clear">🧽 지우기</button><button class="btn secondary" id="back">◀ 이전</button><button class="btn" id="next">다음 ▶</button></div><div class="actions"><button class="btn secondary" id="menu">월드 메뉴</button><button class="btn green" id="fight">⚔️ 보스 도전</button></div></section>`);document.getElementById('clear').onclick=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);drawCount=0;document.getElementById('drawfb').textContent='다시 따라 써 보자!'};document.getElementById('back').onclick=()=>write(card-1);document.getElementById('next').onclick=()=>write(card+1);document.getElementById('menu').onclick=()=>world(wi);document.getElementById('fight').onclick=startBattle;
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),area=document.getElementById('draw');const rect=area.getBoundingClientRect(),scale=window.devicePixelRatio||1;canvas.width=Math.round(rect.width*scale);canvas.height=Math.round(rect.height*scale);ctx.scale(scale,scale);ctx.lineWidth=12;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#2858b1';let active=false,last=null,length=0;const point=e=>{const r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}};
function down(e){e.preventDefault();active=true;length=0;last=point(e);try{canvas.setPointerCapture(e.pointerId)}catch(err){}ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(last.x+.1,last.y+.1);ctx.stroke()}
function move(e){if(!active)return;e.preventDefault();const p=point(e);length+=Math.hypot(p.x-last.x,p.y-last.y);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p}
function up(){if(!active)return;active=false;if(length>32){drawCount++;if(drawCount>=3&&!drawDone){drawDone=true;const k=wi+'-'+w[0];if(!save.traced[k]){save.traced[k]=true;save.gems+=10;persist()}document.getElementById('drawfb').textContent='✨ 따라 쓰기 완료! 보석 +10 (처음 완료 시)';sound()}else if(!drawDone){document.getElementById('drawfb').textContent=`좋아! 조금 더 써 보자 (${drawCount}/3)`}}}
canvas.addEventListener('pointerdown',down);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);drawCleanup=()=>{canvas.removeEventListener('pointerdown',down);canvas.removeEventListener('pointermove',move);canvas.removeEventListener('pointerup',up);canvas.removeEventListener('pointercancel',up)};
}
function startBattle(){boss={hp:5,miss:0,word:null,options:[],locked:false};nextAttack()}
function nextAttack(){if(!boss)return;const pool=DATA[wi].words,w=pick(pool),other=shuffle(pool.filter(x=>x[0]!==w[0])).slice(0,3);boss.word=w;boss.options=shuffle([w,...other]);showBattle()}
function showBattle(){if(!boss)return;const b=boss,w=DATA[wi];layout(`<section class="panel center"><span class="eyebrow">⚔️ 월드 ${wi+1} 보스전</span><div class="boss">${w.boss.split(' ')[0]}</div><h2>${w.boss.split(' ').slice(1).join(' ')}</h2><div class="enemyhp">몬스터 체력 ${'❤️'.repeat(b.hp)}${'🤍'.repeat(5-b.hp)}</div><div class="progress"><div style="width:${b.hp*20}%;background:#ff7d93"></div></div><p><b>「${b.word[1]} ${b.word[2]}」</b>에 해당하는 한자를 터치해서 공격해!</p><div class="choices">${b.options.map((o,i)=>`<button class="choice" data-opt="${i}">${o[0]}</button>`).join('')}</div><div class="feedback" id="fb">실수해도 괜찮아. 힌트를 보면서 다시 해 봐!</div><div class="actions"><button class="btn secondary" id="menu">월드 메뉴</button></div></section>`);document.querySelectorAll('[data-opt]').forEach(e=>e.onclick=()=>attack(+e.dataset.opt));document.getElementById('menu').onclick=()=>world(wi)}
function attack(i){const b=boss;if(!b||b.locked)return;const target=b.options[i];if(target[0]===b.word[0]){b.hp--;save.gems+=10;persist();sound();if(b.hp===0){win();return}nextAttack()}else{b.miss++;sound(false);document.querySelectorAll('[data-opt]')[i]?.classList.add('hidden');document.getElementById('fb').textContent=`힌트! 정답은 「${b.word[0]}」 · ${b.word[1]} ${b.word[2]}야. 다시 터치해 봐!`}}
function win(){boss=null;if(!save.cleared.includes(wi)){save.cleared.push(wi);save.gems+=80}save.opened=Math.min(7,Math.max(save.opened,wi+1));persist();sound();layout(`<section class="panel center"><div class="reward">🏆🎉</div><h1>보스 물리치기 성공!</h1><p>${DATA[wi].name} 정복 완료!<br>다음 월드가 열렸어. 멋진 한자 영웅이야!</p><div class="notice">💎 현재 보석: <b>${save.gems}</b><br>✍️ 쓰기 연습과 짝 맞추기도 계속할 수 있어.</div><div class="actions"><button class="btn secondary" id="menu">지도 보기</button><button class="btn" id="next">${wi<7?'🌟 다음 월드':'🏝️ 모험 완료'}</button></div></section>`);document.getElementById('menu').onclick=home;document.getElementById('next').onclick=()=>wi<7?world(wi+1):home()}
home();
</script><script src="feedback.js"></script></body></html>

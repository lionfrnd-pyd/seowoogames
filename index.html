<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3eb">
  <title>Hello Seowoo</title>
  <link rel="stylesheet" href="feedback.css?v=2">
  <style>
    :root {
      color-scheme: light;
      font-family: "Trebuchet MS", "Noto Sans KR", sans-serif;
      background: #f6f3eb;
      color: #202b25;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 12% 18%, #d7edcf 0, transparent 34%),
        radial-gradient(ellipse at 92% 84%, #f6d8b8 0, transparent 32%),
        #f6f3eb;
    }

    main {
      width: min(100%, 560px);
      margin: auto 0;
      padding: clamp(32px, 9vw, 64px) 24px;
      text-align: center;
      animation: arrive 650ms cubic-bezier(.2,.8,.2,1) both;
    }

    .spark {
      display: inline-grid;
      width: 76px;
      aspect-ratio: 1;
      place-items: center;
      margin-bottom: 24px;
      border: 1px solid #d5d9c9;
      border-radius: 50%;
      background: #fffdf7;
      color: #e3744d;
      font-size: 34px;
      animation: float 3s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      font-size: clamp(48px, 15vw, 88px);
      line-height: 1;
      font-weight: 800;
    }

    p {
      margin: 20px 0 0;
      color: #536158;
      font-size: 17px;
      line-height: 1.6;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      width: min(100%, 360px);
      margin: 32px auto 0;
    }

    .games a,
    .games button {
      display: grid;
      place-items: center;
      min-height: 52px;
      padding: 0 12px;
      border: 0;
      border-radius: 12px;
      background: #202b25;
      color: #fffdf7;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }

    .games button { appearance: none; }

    .games a:nth-child(2),
    .games .add-game {
      background: #e3744d;
    }

    .games .word-puzzle { background: #536f62; }

    .games .add-game { grid-column: 1 / -1; }

    .games a:focus-visible,
    .games button:focus-visible {
      outline: 3px solid #536158;
      outline-offset: 3px;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      50% { transform: translateY(-5px) rotate(5deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="spark" aria-hidden="true">✦</div>
    <h1>Hello Seowoo</h1>
    <p>오늘도 반가워요.</p>
    <div class="games" aria-label="게임 선택">
      <a href="Jump_BlockWorld_6_0_10_Worlds.html">점프</a>
      <a href="hanja_touch_adventure_mobile.html">한자</a>
      <a class="word-puzzle" href="word_puzzle.html">낱말</a>
      <button class="add-game" id="addGame" type="button">게임추가</button>
    </div>
  </main>
  <section class="feedback-panel" data-feedback-panel aria-labelledby="feedbackTitle">
    <div class="feedback-heading">
      <div><h2 id="feedbackTitle">서우의 요청 기록</h2><p>필요한 점을 적어 두면 이 브라우저에서 요청 히스토리를 볼 수 있어요.</p></div>
      <span class="feedback-count" id="feedbackCount" aria-label="저장된 요청 수">0</span>
    </div>
    <form class="feedback-form" id="feedbackForm">
      <label class="feedback-label">필요한 기능이나 바꾸고 싶은 점
        <textarea class="feedback-control feedback-message" name="message" rows="3" maxlength="500" required placeholder="생각난 내용을 여기에 적어줘"></textarea>
      </label>
      <div class="feedback-form-footer"><span class="feedback-status" id="feedbackStatus" role="status" aria-live="polite">이 기록은 이 브라우저에만 저장돼요.</span><button class="feedback-submit" type="submit">기록하기</button></div>
    </form>
    <div class="feedback-history-heading"><h3>요청 히스토리</h3><button class="feedback-clear" id="feedbackClear" type="button">전체 삭제</button></div>
    <ol class="feedback-list" id="feedbackList" aria-live="polite"></ol>
  </section>
  <script src="feedback.js?v=2"></script>
</body>
</html>

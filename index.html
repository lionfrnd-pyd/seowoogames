<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3eb">
  <title>Hello Seowoo</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Trebuchet MS", "Noto Sans KR", sans-serif;
      background: #f6f3eb;
      color: #202b25;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 12% 18%, #d7edcf 0, transparent 34%),
        radial-gradient(ellipse at 92% 84%, #f6d8b8 0, transparent 32%),
        #f6f3eb;
    }

    main {
      width: min(100%, 560px);
      padding: clamp(32px, 9vw, 64px) 24px;
      text-align: center;
      animation: arrive 650ms cubic-bezier(.2,.8,.2,1) both;
    }

    .spark {
      display: inline-grid;
      width: 76px;
      aspect-ratio: 1;
      place-items: center;
      margin-bottom: 24px;
      border: 1px solid #d5d9c9;
      border-radius: 50%;
      background: #fffdf7;
      color: #e3744d;
      font-size: 34px;
      animation: float 3s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      font-size: clamp(48px, 15vw, 88px);
      line-height: 1;
      font-weight: 800;
    }

    p {
      margin: 20px 0 0;
      color: #536158;
      font-size: 17px;
      line-height: 1.6;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      width: min(100%, 360px);
      margin: 32px auto 0;
    }

    .games button {
      min-height: 52px;
      border: 0;
      border-radius: 12px;
      background: #202b25;
      color: #fffdf7;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .games button:nth-child(2) {
      background: #e3744d;
    }

    .games button:focus-visible {
      outline: 3px solid #536158;
      outline-offset: 3px;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      50% { transform: translateY(-5px) rotate(5deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="spark" aria-hidden="true">✦</div>
    <h1>Hello Seowoo</h1>
    <p>오늘도 반가워요.</p>
    <div class="games" aria-label="게임 선택">
      <button type="button">game1</button>
      <button type="button">game2</button>
    </div>
  </main>
</body>
</html>
